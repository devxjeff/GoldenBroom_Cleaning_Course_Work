<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page Not Found — Golden Broom</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.error-page{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#0D0D0D,#1A4731);padding:40px 20px}
.error-num{font-family:'Playfair Display',serif;font-size:120px;font-weight:900;color:var(--gold);line-height:1;margin-bottom:8px}
.error-title{font-size:28px;color:var(--white);margin-bottom:14px}
.error-msg{font-size:16px;color:var(--grey);margin-bottom:36px;max-width:400px;line-height:1.8}
</style>
<script src="js/theme.js"></script>
</head>
<body>
<main class="error-page">
  <div>
    <div class="error-num">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-msg">The page you're looking for doesn't exist or has been moved.</p>
    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
      <a href="index.html" class="btn btn-gold">← Back to Home</a>
      <a href="contact.html" class="btn btn-outline">Contact Us</a>
    </div>
  </div>
</main>
</body></html>
